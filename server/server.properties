# MinecraftPE-Sever 配置
# 改完重启服务器生效。

# 客户端服务器列表里显示的名字
server-name=A Minecraft PE Server

# UDP 监听端口
server-port=19132
max-players=16

# 存档
level-name=world
level-display-name=world
# 0 = 每次启动随机；非 0 固定种子
level-seed=0

# survival | creative
gamemode=survival
# old(有限 256x256) | infinite
level-type=infinite

# 玩家进服提示语
motd=Welcome!

# ---- 世界规则 ----
# 昼夜是否更替（false = 时间冻结，太阳不动）
do-daylight-cycle=true
# 是否生成和平生物（猪/牛/羊/鸡…）
spawn-animals=true
# 是否生成敌对生物（僵尸/骷髅/蜘蛛…）
spawn-monsters=true
# 难度：peaceful | easy | normal | hard（peaceful 时敌对生物不刷、已存在的会消失）
difficulty=normal

# 旧版 TCP 命令端口（无鉴权，默认关）
enable-command-server=false
command-port=4711
